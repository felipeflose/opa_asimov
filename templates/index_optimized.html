<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSSISTEMA FLOSE</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            z-index: 10;
        }
        #header h1 {
            margin: 0;
            font-size: 24px;
        }
        #header span {
            margin-left: 10px;
            font-size: 16px;
        }
        #graph {
            position: absolute;
            top: 50px;
            left: 0;
            width: 100%;
            height: calc(100vh - 50px);
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>ECOSSISTEMA FLOSE</h1>
        <div id="info-bar">
            <span id="update-date">N/A</span>
            <span id="node-count">0 NODES</span>
        </div>
    </div>
    <div id="graph"></div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        graphData = {{ graph_data|tojson }};
        
        const width = window.innerWidth, height = window.innerHeight - 50;
        let simulation, nodes, edges, svg, container;

        function start() {
            document.getElementById('update-date').innerText = (graphData.last_updated || "N/A");
            document.getElementById('node-count').innerText = (graphData.nodes ? graphData.nodes.length : 0) + " NODES";
            
            nodes = (graphData.nodes || []).map(n => ({...n}));
            edges = (graphData.edges || []).map(e => ({...e}));
            
            svg = d3.select("#graph").append("svg")
                .attr("width", width)
                .attr("height", height);

            simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(edges).id(d => d.id).distance(120).strength(0.4))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collision", d3.forceCollide().radius(d => d.type === 'mestre' ? 30 : 15))
                .force("radial", d3.forceRadial(d => d.type === 'mestre' ? 0 : 500, width / 2, height / 2).strength(0.02));

            const link = svg.append("g").selectAll("line").data(edges).join("line")
                .attr("stroke", "#e2e8f0")
                .attr("stroke-width", d => Math.min(d.source.r, d.target.r) * 0.3)
                .style("transition", "stroke 0.3s");

            const node = svg.append("g").selectAll(".node").data(nodes).join("g")
                .attr("class", d => `node type-${d.type}`)
                .on("click", (e, d) => {
                    if (d.fx !== null) { d.fx = null; d.fy = null; simulation.alpha(0.3).restart(); }
                    
                    const g = d3.select(e.currentTarget);
                    const wasActive = g.classed("active");
                    
                    d3.selectAll(".node").classed("active", false);
                    d3.selectAll("line").style("stroke", "#e2e8f0").style("stroke-opacity", 0.6).attr("stroke-width", d => Math.min(d.source.r, d.target.r) * 0.3);
                    d3.selectAll("circle").style("fill-opacity", 1);

                    if (!wasActive) {
                        g.classed("active", true);
                        const connectedLines = d3.selectAll("line").filter(l => {
                            const sId = typeof l.source === 'object' ? l.source.id : l.source;
                            const tId = typeof l.target === 'object' ? l.target.id : l.target;
                            return sId === d.id || tId === d.id;
                        });
                        connectedLines.style("stroke", "#fff").style("stroke-opacity", 1).attr("stroke-width", d => Math.min(d.source.r, d.target.r) * 0.6);
                    }
                })
                .call(d3.drag().on("start", dragstart).on("drag", dragged).on("end", dragend));

            node.append("circle")
                .attr("r", d => {
                    if (d.type === 'mestre') return 12;
                    if (d.type === 'tech') return 8;
                    if (d.id.includes('CV/')) return 6;
                    if (d.id.includes('MBA/')) return 6;
                    if (d.type === 'folder') return 4;
                    return 2.5;
                })
                .attr("fill", d => {
                    if (d.type === 'mestre') return '#0D9488';
                    if (d.type === 'tech') return '#1E88E5';
                    if (d.id.includes('CV/')) return '#FBC02D';
                    if (d.id.includes('MBA/')) return '#EF5350';
                    if (d.type === 'folder') return '#42A5F5';
                    return '#7986CB';
                })
                .style("filter", d => (d.type === 'mestre' || d.type === 'tech') ? "drop-shadow(0 0 8px hsl(160, 80%, 55%))" : "none")
                .attr("stroke", "#42A5F5")
                .attr("stroke-width", 1)
                .style("transition", "r 0.3s, fill 0.3s");

            node.append("text")
                .attr("dx", d => Math.min(d.r * 1.5, 12))
                .attr("dy", 4)
                .text(d => d.title)
                .style("fill", "#e2e8f0")
                .style("font-size", "11px")
                .style("font-weight", "400")
                .style("opacity", "0.9")
                .style("pointer-events", "none")
                .style("text-shadow", "0 1px 3px #000");

            simulation.on("tick", () => {
                link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        function dragstart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
        function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
        function dragend(e, d) {
            if (!e.active) simulation.alphaTarget(0);
            d.fx = e.x; d.fy = e.y;
            d3.select(e.sourceEvent.currentTarget).select("circle").attr("r", 2.5);
        }

        function resetPins() {
            nodes.forEach(d => {
                d.fx = null;
                d.fy = null;
            });
            simulation.alphaTarget(0).restart();
        }
        start();
    </script>
</body>
</html>
