name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPO_NAME: flose-repo
  IMAGE_NAME: flose-ai-platform

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Frontend
        working-directory: AtualizaAI/frontend
        run: |
          npm install
          npm run build

      - name: Build and Push Docker Image
        run: |
          gcloud builds submit --tag "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest" AtualizaAI/ --project=${{ env.PROJECT_ID }} --suppress-logs || echo "Build iniciado, mas streaming de logs falhou localmente. Verificando status no GCP..."

      - name: Setup Cloud Scheduler for Broker Cycle
        run: |
          # Garantir que a API necessária esteja ativa
          gcloud services enable cloudscheduler.googleapis.com --project=${{ env.PROJECT_ID }}
          
          SERVICE_URL=$(gcloud run services describe ${{ env.IMAGE_NAME }} \
            --platform managed --region ${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} --format="value(status.url)")
          
          gcloud scheduler jobs create http broker-nightly-cycle \
            --schedule="0 0 * * *" \
            --uri="${SERVICE_URL}/broker_cycle" \
            --http-method=POST \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --description="Ciclo noturno de certificação de agentes" \
            || gcloud scheduler jobs update http broker-nightly-cycle \
            --schedule="0 0 * * *" \
            --uri="${SERVICE_URL}/broker_cycle" \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
            
          gcloud scheduler jobs create http synergy-weekly-cycle \
            --schedule="0 17 * * 5" \
            --uri="${SERVICE_URL}/api/reports/synergy-cycle" \
            --http-method=POST \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --description="Relatório semanal de sinergia" \
            || gcloud scheduler jobs update http synergy-weekly-cycle \
            --schedule="0 17 * * 5" \
            --uri="${SERVICE_URL}/api/reports/synergy-cycle" \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --project=${{ env.PROJECT_ID }} \
            --set-env-vars "GCP_PROJECT_ID=${{ env.PROJECT_ID }}" \
            --cpu 2 \
            --memory 2Gi \
            --min-instances 0 \
            --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest,GEMINI_MODEL=GEMINI_MODEL:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest,NAPKIN_API_KEY=NAPKIN_API_KEY:latest,MASTER_KEY=MASTER_KEY:latest,ADMIN_EMAIL=ADMIN_EMAIL:latest"

      - name: Update Telegram Webhook
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.IMAGE_NAME }} --platform managed --region ${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format="value(status.url)")
          WEBHOOK_URL="${SERVICE_URL}/telegram_webhook"
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook?url=${WEBHOOK_URL}"
          
      - name: Notify Telegram of Success
        if: success()
        run: |
          VERSION=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          MESSAGE="✅ *Deploy Concluído* %0A🚀 *Projeto:* ${{ env.PROJECT_ID }} %0A🔖 *Versão (SHA):* $VERSION %0A⏱️ *Horário:* $TIMESTAMP"
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$MESSAGE&parse_mode=Markdown"

      - name: Log DORA Metrics (Self-Report)
        if: success()
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.IMAGE_NAME }} --platform managed --region ${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format="value(status.url)")
          curl -X POST "${SERVICE_URL}/api/webhook/github" \
            -H "Content-Type: application/json" \
            -d "{\"ref\": \"refs/heads/main\", \"after\": \"${{ github.sha }}\", \"commits\": []}"
